name: Hello CI
on: push

jobs:
  job-one:
    runs-on: ubuntu-latest
    env:
      GREETING: "hi from env var"
    steps:
      - run: echo "$GREETING"
      - run: echo "secret is set = ${{ secrets.MY_SECRET != '' }}"
      - run: echo "the secret itself is ${{ secrets.MY_SECRET }}"

  job-two:
    needs: job-one
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "this only runs on main branch"

